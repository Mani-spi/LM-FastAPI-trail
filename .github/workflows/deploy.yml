
name: Deploy to Hostinger

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get current date and time
        id: date
        run: echo "timestamp=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "Error: SSH_HOST secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "Error: SSH_USER secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "Error: SSH_PASSWORD secret is not set."
            exit 1
          fi

      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            # Define project path
            PROJECT_PATH="/home/${{ secrets.SSH_USER }}/lm_fastapi_v2"
            
            # Go to your actual project folder or create it
            mkdir -p $PROJECT_PATH
            cd $PROJECT_PATH

            # Pull latest code or clone if missing
            if [ -d ".git" ]; then
              echo "Pulling latest changes..."
              git reset --hard
              git pull origin master
            else
              echo "Cloning repository..."
              git clone https://github.com/Mani-spi/LM-FastAPI-trail.git .
            fi

            # Rebuild Docker
            echo "Building and starting containers..."
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d

            # Clean unused images
            docker image prune -f

            echo "Deployment completed successfully!"

      - name: Create Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: Release v1.0.${{ github.run_number }}
          body: |
            ## 🚀 Deployment Successful
            
            *Deployed at:* ${{ steps.date.outputs.timestamp }}
            *Commit:* ${{ github.sha }}
            *Branch:* ${{ github.ref_name }}
            *Deployed by:* ${{ github.actor }}
            
            ### Changes in this release:
            ${{ github.event.head_commit.message }}
            
            ### Deployment Details:
            - Code deployed to Hostinger VPS
            - Strategy: Git Pull + Build on Server
            - Docker containers rebuilt and started
            
            ---
            Automated deployment via GitHub Actions
          draft: false
          prerelease: false